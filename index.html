  <meta name="theme-color" content="#f7f7f5" />
  <script>
    // Apply the theme before first paint: stored choice first, then the system setting.
    (function () {
      var stored = null;
      try { stored = localStorage.getItem("theme"); } catch (e) {}
      var dark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) document.documentElement.classList.add("motion");
      document.querySelector('meta[name="theme-color"]').content = dark ? "#131518" : "#f7f7f5";
    })();
  </script>
